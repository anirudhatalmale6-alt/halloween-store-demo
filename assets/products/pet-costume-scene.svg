</radialGradient>
<radialGradient id="back" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ff7518" stop-opacity=".3"/>
<stop offset="55%" stop-color="#ff7518" stop-opacity=".12"/>
<stop offset="100%" stop-color="#ff7518" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="600" height="600" fill="url(#sky)"/>
<circle cx="472" cy="118" r="120" fill="url(#moon)"/>
